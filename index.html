<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SJC Library Portal - Book Entry Form (Supabase)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f0ed;color:#35212a}
header{background:#6b1730;color:#fff;padding:22px;text-align:center;border-bottom:5px solid #d5a44d}
header h1{margin:0 0 8px}header p{margin:0;color:#f4d58a}
.container{max-width:1000px;margin:30px auto;padding:25px;background:#fff;border-radius:14px;box-shadow:0 8px 25px #32151d15}
h2{color:#6b1730;border-bottom:2px solid #d5a44d;padding-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field label{display:block;margin-bottom:7px;font-weight:bold;font-size:14px}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d8cbd0;border-radius:7px;font-size:14px;background:#fff}
.field textarea{resize:vertical;min-height:42px}
.full-width{grid-column:1/-1}
.buttons{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
button{padding:12px 20px;border:none;border-radius:7px;cursor:pointer;font-weight:bold}
.save-btn{background:#6b1730;color:#fff}.reset-btn{background:#eee5e8;color:#6b1730}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}
th,td{padding:11px;border:1px solid #e1d7db;text-align:left}
th{background:#6b1730;color:#fff}tr:nth-child(even){background:#faf6f7}
#statusMessage{color:#167344;font-weight:bold}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}.full-width{grid-column:auto}.container{margin:15px;padding:18px}}
</style>
</head>
<body>
<header><h1>SJC Library Portal</h1><p>Student Book Entry and Tracking Form</p></header>
<div class="container">
<h2>Student Details</h2>
<form id="bookForm">
<div class="form-grid">
<div class="field"><label for="dno">D.NO</label>
<input type="text" id="dno" placeholder="Enter student D.NO" pattern="25UCS(50[1-9]|5[1-5][0-9]|56[0-5])" title="Enter D.NO from 25UCS501 to 25UCS565" required></div>
<div class="field"><label for="studentName">Student Name</label><input type="text" id="studentName" required></div>
<div class="field"><label for="department">Department</label>
<select id="department" required><option>B.Sc. Computer Science</option><option>BCA</option><option>B.Sc. Mathematics</option><option>B.Com</option><option>Other</option></select></div>
<div class="field"><label for="year">Year</label>
<select id="year" required><option>I Year</option><option selected>II Year</option><option>III Year</option></select></div>
<div class="field"><label for="phone">Phone Number</label><input type="tel" id="phone" pattern="[0-9]{10}" title="Enter a 10-digit phone number"></div>
<div class="field"><label for="email">Email Address</label><input type="email" id="email"></div>
</div>
<h2>Book Details</h2>
<div class="form-grid">
<div class="field"><label for="bookId">Book ID / Accession Number</label><input type="text" id="bookId" required></div>
<div class="field"><label for="bookTitle">Book Title</label><input type="text" id="bookTitle" required></div>
<div class="field"><label for="author">Author Name</label><input type="text" id="author" required></div>
<div class="field"><label for="issueDate">Date of Issue</label><input type="date" id="issueDate" required></div>
<div class="field"><label for="dueDate">Expected Return Date</label><input type="date" id="dueDate" required></div>
<div class="field"><label for="actualReturn">Actual Return Date</label><input type="date" id="actualReturn"></div>
<div class="field"><label for="bookStatus">Book Status</label>
<select id="bookStatus" required><option>Issued</option><option>Returned</option><option>Overdue</option></select></div>
<div class="field"><label for="fine">Fine Amount (Rs.)</label><input type="number" id="fine" min="0" step="0.01" value="0" required></div>
<div class="field full-width"><label for="remarks">Remarks</label><textarea id="remarks"></textarea></div>
</div>
<div class="buttons">
<button class="save-btn" type="submit">Save Book Record</button>
<button class="reset-btn" type="reset">Clear Form</button>
</div>
<p id="statusMessage" role="status" aria-live="polite"></p>
</form>

<h2>Book Records</h2>
<div class="table-wrapper"><table>
<thead><tr><th>D.NO</th><th>Student Name</th><th>Book ID</th><th>Book Title</th><th>Issue Date</th><th>Due Date</th><th>Status</th><th>Fine (Rs.)</th></tr></thead>
<tbody id="recordsTable"><tr><td colspan="8" style="text-align:center">Loading...</td></tr></tbody>
</table></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// 1. PASTE YOUR OWN VALUES (Supabase -> Project Settings -> API)
const SUPABASE_URL = "https://YOUR-PROJECT-ID.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("bookForm");
const recordsTable = document.getElementById("recordsTable");
const statusMessage = document.getElementById("statusMessage");
const issueDate = document.getElementById("issueDate");
const dueDate = document.getElementById("dueDate");
const actualReturn = document.getElementById("actualReturn");
const val = id => document.getElementById(id).value.trim();

issueDate.addEventListener("change", () => {
  dueDate.min = issueDate.value;
  actualReturn.min = issueDate.value;
});

async function loadRecords() {
  const { data, error } = await db.from("book_records")
    .select("dno,student_name,book_id,book_title,issue_date,due_date,book_status,fine")
    .order("created_at", { ascending: false });
  recordsTable.innerHTML = "";
  if (error) { recordsTable.innerHTML = '<tr><td colspan="8" style="text-align:center">Could not load records.</td></tr>'; console.error(error); return; }
  if (!data.length) { recordsTable.innerHTML = '<tr><td colspan="8" style="text-align:center">No book records added yet.</td></tr>'; return; }
  data.forEach(r => {
    const tr = document.createElement("tr");
    [r.dno, r.student_name, r.book_id, r.book_title, r.issue_date, r.due_date, r.book_status, Number(r.fine).toFixed(2)]
      .forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    recordsTable.appendChild(tr);
  });
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const dno = val("dno").toUpperCase();
  const m = /^25UCS(\d{3})$/.exec(dno);
  if (!m || Number(m[1]) < 501 || Number(m[1]) > 565) { alert("Enter a D.NO between 25UCS501 and 25UCS565."); return; }
  if (dueDate.value < issueDate.value) { alert("Expected return date cannot be before the issue date."); return; }
  if (actualReturn.value && actualReturn.value < issueDate.value) { alert("Actual return date cannot be before the issue date."); return; }

  const record = {
    dno, student_name: val("studentName"), department: val("department"), year: val("year"),
    phone: val("phone") || null, email: val("email") || null,
    book_id: val("bookId"), book_title: val("bookTitle"), author: val("author"),
    issue_date: issueDate.value, due_date: dueDate.value, actual_return: actualReturn.value || null,
    book_status: val("bookStatus"), fine: Number(val("fine")), remarks: val("remarks") || null
  };

  const { error } = await db.from("book_records").insert(record);
  if (error) { statusMessage.style.color = "#b00020"; statusMessage.textContent = "Error: " + error.message; return; }
  statusMessage.style.color = "#167344";
  statusMessage.textContent = "Book record saved to Supabase!";
  form.reset();
  document.getElementById("department").value = "B.Sc. Computer Science";
  document.getElementById("year").value = "II Year";
  document.getElementById("fine").value = "0";
  dueDate.min = ""; actualReturn.min = "";
  loadRecords();
});

loadRecords();
</script>
</body>
</html>
